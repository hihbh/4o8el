<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Out Cosmetics</title>
<style>
  :root{
    --bg:#F7ECE6;
    --card:#FDF8F5;
    --maroon:#7C3B40;
    --maroon-dark:#5C2A2E;
    --pink:#F1D8D4;
    --pink-soft:#F6E4E0;
    --text:#2E2220;
    --muted:#95817E;
    --line:#EBD9D3;
    --danger:#B4442E;
    --gold:#C79A5A;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    background:#e7d9d2;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    color:var(--text);
  }
  .serif{font-family:'Georgia','Times New Roman',serif;}
  .phone{
    width:390px;height:844px;
    background:var(--bg);
    border-radius:44px;
    box-shadow:0 30px 60px rgba(60,30,25,.35), 0 0 0 10px #1c1210;
    overflow:hidden;
    position:relative;
    display:flex;flex-direction:column;
  }
  .statusbar{
    height:34px;flex:0 0 34px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;font-size:13px;font-weight:600;color:var(--text);
    background:transparent;position:relative;z-index:5;
  }
  .statusbar .dot{width:8px;height:8px;}
  .screen{
    flex:1;overflow-y:auto;position:relative;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 20px 12px;
  }
  .topbar .logo{font-size:20px;color:var(--maroon);letter-spacing:1px;text-align:center;flex:1;}
  .topbar .logo small{display:block;font-size:7px;letter-spacing:3px;color:var(--muted);font-family:sans-serif;margin-top:2px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);color:var(--maroon-dark);
    cursor:pointer;flex:0 0 34px;position:relative;
  }
  .icon-btn svg{width:17px;height:17px;}
  .badge-dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--danger);border-radius:50%;border:2px solid var(--bg);}
  .content{padding:0 20px 100px;}
  h1.page-title{font-size:20px;margin:6px 0 14px;font-weight:700;}
  .backrow{display:flex;align-items:center;gap:10px;padding:14px 20px 6px;}
  .backrow h1{font-size:18px;margin:0;flex:1;}

  /* SPLASH */
  .splash{
    height:100%;width:100%;position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 30%, #f3e2dc 0%, #e9cec6 60%, #dcb9ae 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .splash .circle{
    width:230px;height:230px;border-radius:50%;
    background:rgba(255,250,247,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 40px rgba(255,255,255,.4) inset;
  }
  .splash .circle h1{font-size:26px;color:var(--maroon-dark);margin:0;letter-spacing:1px;}
  .splash .circle .sub{font-size:9px;letter-spacing:5px;color:var(--maroon);margin-top:6px;font-family:sans-serif;}
  .splash .circle .tag{font-size:9px;letter-spacing:3px;color:#8a6b62;margin-top:12px;font-family:sans-serif;border-top:1px solid #b98f85;padding-top:8px;}
  .loadwrap{position:absolute;bottom:70px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .loadwrap span{font-size:12px;color:#6b4b44;letter-spacing:1px;}
  .loadbar{width:140px;height:4px;background:rgba(255,255,255,.5);border-radius:4px;overflow:hidden;}
  .loadbar i{display:block;height:100%;width:0%;background:var(--maroon);border-radius:4px;transition:width 1.6s ease;}

  /* BOTTOM NAV */
  .bottomnav{
    position:absolute;bottom:0;left:0;right:0;height:82px;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;
    z-index:20;
  }
  .navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10px;cursor:pointer;width:60px;position:relative;}
  .navitem.active{color:var(--maroon);font-weight:700;}
  .navitem svg{width:20px;height:20px;}
  .navitem .cartbadge{position:absolute;top:-6px;right:8px;background:var(--danger);color:#fff;font-size:9px;border-radius:8px;padding:1px 5px;font-weight:700;}
  .navitem.center{margin-top:-26px;}
  .navcart-circle{
    width:52px;height:52px;border-radius:50%;background:var(--maroon);
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:0 8px 16px rgba(124,59,64,.4);
  }
  .navcart-circle svg{width:22px;height:22px;}

  /* HOME */
  .hero{
    margin:0 20px 18px;border-radius:20px;overflow:hidden;position:relative;height:150px;
    background:linear-gradient(120deg,#e7cdc4,#d3aca1);
    display:flex;align-items:center;padding:0 22px;color:var(--maroon-dark);
  }
  .hero h2{font-size:22px;margin:0 0 12px;line-height:1.2;font-weight:700;}
  .hero-art{position:absolute;right:10px;bottom:10px;opacity:.95;}
  .hero button{
    background:var(--maroon);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .dots{display:flex;gap:5px;position:absolute;bottom:10px;left:0;right:0;justify-content:center;}
  .dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7);}
  .dots span.on{background:var(--maroon-dark);width:14px;border-radius:4px;}
  .catrow{display:flex;justify-content:space-between;padding:2px 20px 22px;}
  .catitem{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--text);cursor:pointer;width:64px;text-align:center;}
  .catcircle{width:54px;height:54px;border-radius:50%;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .catcircle svg,.gridcat .ic svg{width:52%;height:52%;}
  .sectionhead{display:flex;justify-content:space-between;align-items:center;padding:0 20px 10px;}
  .sectionhead h3{font-size:16px;margin:0;}
  .sectionhead a{font-size:12px;color:var(--maroon);text-decoration:none;font-weight:600;cursor:pointer;}
  .hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px 10px;scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none;}
  .pcard{
    flex:0 0 130px;background:var(--card);border-radius:16px;padding:10px;border:1px solid var(--line);position:relative;cursor:pointer;
  }
  .pcard .thumb{height:90px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .thumb svg{width:60%;height:90%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12));}
  .prow .thumb svg,.cart-item .thumb svg{width:70%;height:85%;}
  .pd-hero svg{width:220px;height:280px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));}
  .pcard .brand{font-size:10px;color:var(--muted);}
  .pcard .name{font-size:12px;font-weight:600;line-height:1.3;margin:2px 0 4px;min-height:32px;}
  .pcard .price{font-size:13px;font-weight:700;color:var(--maroon-dark);}
  .heart{position:absolute;top:10px;right:10px;cursor:pointer;color:var(--muted);}
  .heart.active{color:var(--danger);}
  .heart svg{width:16px;height:16px;}

  /* Product bottle placeholders */
  .thumb.tf1{background:linear-gradient(160deg,#f3d8c2,#e0a878);}
  .thumb.tf2{background:linear-gradient(160deg,#f0e3d8,#d9c2a8);}
  .thumb.tf3{background:linear-gradient(160deg,#e8d3c8,#b98a76);}
  .thumb.tf4{background:linear-gradient(160deg,#f4c9c0,#d98f7f);}
  .thumb.tf5{background:linear-gradient(160deg,#e9d6c8,#c9a488);}

  /* CATEGORIES GRID */
  .search-input{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;margin:4px 20px 16px;color:var(--muted);font-size:13px;
  }
  .search-input input{border:none;background:transparent;outline:none;flex:1;font-size:13px;color:var(--text);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 20px;}
  .gridcat{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  }
  .gridcat .ic{width:50px;height:50px;border-radius:50%;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .gridcat span{font-size:13px;font-weight:600;}
  .gridcat small{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px;}

  /* FILTER TABS */
  .tabs{display:flex;gap:8px;padding:6px 20px 16px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:7px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;}
  .tab.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}

  /* PRODUCT LIST ROW */
  .prow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 20px 12px;position:relative;cursor:pointer;}
  .prow .thumb{width:64px;height:64px;flex:0 0 64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .prow .info{flex:1;}
  .prow .brand{font-size:10px;color:var(--muted);}
  .prow .name{font-size:13px;font-weight:700;margin:2px 0;}
  .prow .shade{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .prow .pricerow{display:flex;align-items:center;gap:6px;}
  .prow .price{font-size:13px;font-weight:700;color:var(--maroon-dark);}
  .prow .oldprice{font-size:11px;color:var(--muted);text-decoration:line-through;}
  .badge-off{position:absolute;bottom:12px;right:12px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;}

  /* PRODUCT DETAIL */
  .pd-hero{height:300px;background:linear-gradient(160deg,#f0dccd,#d6ab8f);display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;}
  .pd-topbar{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:5;}
  .pd-body{padding:20px;}
  .pd-brand{font-size:12px;color:var(--muted);}
  .pd-name{font-size:20px;font-weight:700;margin:4px 0 8px;}
  .pd-rating{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .pd-rating b{color:var(--text);}
  .stars{color:var(--gold);}
  .pd-pricerow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .pd-price{font-size:22px;font-weight:800;color:var(--maroon-dark);}
  .pd-oldprice{font-size:14px;color:var(--muted);text-decoration:line-through;}
  .pd-off{background:#fbe1dc;color:var(--danger);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .swatches{display:flex;gap:10px;margin-bottom:16px;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .swatch.active{border-color:var(--maroon);}
  select.shade-select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;margin-bottom:16px;color:var(--text);}
  .qty-add{display:flex;gap:12px;margin-bottom:20px;}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .stepper button{width:38px;height:44px;border:none;background:var(--card);font-size:16px;cursor:pointer;color:var(--maroon-dark);}
  .stepper span{width:34px;text-align:center;font-weight:700;}
  .add-cart-btn{flex:1;background:var(--maroon);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .accordion{border-top:1px solid var(--line);}
  .acc-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer;font-weight:600;font-size:14px;}
  .acc-body{max-height:0;overflow:hidden;font-size:13px;color:var(--muted);line-height:1.6;transition:max-height .25s ease;}
  .acc-body.open{max-height:300px;padding-bottom:14px;}

  /* CART */
  .cart-item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;position:relative;}
  .cart-item .thumb{width:64px;height:64px;flex:0 0 64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .cart-item .info{flex:1;}
  .cart-item .name{font-size:13px;font-weight:700;}
  .cart-item .shade{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .cart-item .bottomrow{display:flex;justify-content:space-between;align-items:center;}
  .mini-stepper{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:2px 6px;}
  .mini-stepper button{border:none;background:none;font-size:14px;cursor:pointer;width:20px;color:var(--maroon-dark);}
  .cart-item .remove{position:absolute;top:12px;right:12px;color:var(--muted);cursor:pointer;font-size:16px;}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px;}
  .summary .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .summary .total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin-top:10px;border-top:1px solid var(--line);padding-top:12px;}
  .primary-btn{width:100%;background:var(--maroon);color:#fff;border:none;padding:15px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;}
  .outline-btn{width:100%;background:transparent;color:var(--maroon);border:1.5px solid var(--maroon);padding:14px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty .em-ic{font-size:50px;margin-bottom:14px;}
  .empty h3{color:var(--text);margin-bottom:6px;}

  /* PROFILE */
  .profile-head{display:flex;align-items:center;gap:14px;padding:16px 20px 20px;}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--maroon);}
  .brand-avatar{width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#8a4a4f,var(--maroon-dark));flex-direction:column;border:2px solid #e9c9b8;box-shadow:0 4px 10px rgba(92,42,46,.35);}
  .brand-avatar span{font-size:9px;color:#f3dfd6;letter-spacing:.5px;line-height:1;}
  .brand-avatar small{font-size:4.5px;letter-spacing:2px;color:#e0b8ab;margin-top:2px;font-family:sans-serif;}
  .profile-head h2{font-size:17px;margin:0;}
  .profile-head p{margin:2px 0 0;font-size:12px;color:var(--muted);}
  .menu-list{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 20px;overflow:hidden;}
  .menu-item{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .menu-item:last-child{border-bottom:none;}
  .menu-item .mi-ic{width:32px;height:32px;border-radius:9px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;color:var(--maroon-dark);}
  .menu-item .mi-ic svg{width:16px;height:16px;}
  .menu-item span{flex:1;font-size:14px;font-weight:600;}
  .menu-item svg.chev{width:14px;height:14px;color:var(--muted);}
  .logout-btn{margin:22px 20px 0;background:transparent;border:1.5px solid var(--maroon);color:var(--maroon);padding:14px;border-radius:16px;width:calc(100% - 40px);font-weight:700;font-size:14px;cursor:pointer;}

  /* ORDERS */
  .order-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .order-card .oid{font-weight:700;font-size:13px;}
  .order-card .date{font-size:11px;color:var(--muted);}
  .status-pill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:10px;}
  .status-Processing{background:#FBEAD2;color:#9A6A11;}
  .status-Shipped{background:#DCEBF7;color:#2A6DA8;}
  .status-Delivered{background:#DEF1E1;color:#2E8B4E;}
  .order-items{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .order-bottom{display:flex;justify-content:space-between;align-items:center;}
  .order-total{font-weight:800;font-size:14px;}
  .track-btn{display:flex;align-items:center;gap:6px;background:var(--maroon);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
  .track-btn svg{width:14px;height:14px;}

  /* TRACK MODAL / SCREEN */
  .timeline{padding:10px 6px;}
  .tl-step{display:flex;gap:14px;position:relative;padding-bottom:30px;}
  .tl-step:last-child{padding-bottom:0;}
  .tl-dot-wrap{display:flex;flex-direction:column;align-items:center;}
  .tl-dot{width:26px;height:26px;border-radius:50%;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;color:var(--maroon);font-size:13px;flex:0 0 26px;}
  .tl-dot.done{background:var(--maroon);color:#fff;}
  .tl-line{width:2px;flex:1;background:var(--line);margin-top:4px;}
  .tl-line.done{background:var(--maroon);}
  .tl-text h4{margin:0 0 3px;font-size:14px;}
  .tl-text p{margin:0;font-size:11px;color:var(--muted);}

  /* ADDRESS MODAL */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(30,15,12,.45);z-index:40;
    display:flex;align-items:flex-end;
  }
  .modal-sheet{
    background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:20px;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:17px;}
  .addr-opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;}
  .addr-opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:0 0 20px;display:flex;align-items:center;justify-content:center;}
  .addr-opt.selected .radio{border-color:var(--maroon);}
  .addr-opt.selected .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--maroon);}
  .addr-opt .lbl{font-weight:700;font-size:13px;}
  .addr-opt .txt{font-size:12px;color:var(--muted);}
  .addnew{display:flex;align-items:center;gap:8px;color:var(--maroon);font-weight:700;font-size:13px;padding:8px 4px 18px;cursor:pointer;}

  .toast{
    position:absolute;bottom:100px;left:20px;right:20px;background:var(--maroon-dark);color:#fff;
    padding:12px 16px;border-radius:12px;font-size:13px;text-align:center;z-index:60;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;transform:translateY(10px);
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .info-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;font-size:13px;line-height:1.7;color:var(--muted);}
  .info-block h4{margin:0 0 8px;color:var(--text);font-size:14px;}
  .faq-item{border-bottom:1px solid var(--line);padding:14px 0;}
  .faq-item:last-child{border-bottom:none;}
  .faq-q{font-weight:600;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;}
  .faq-a{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;display:none;}
  .faq-a.open{display:block;}
  .setting-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:13px;font-weight:600;}
  .switch{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;}
  .switch.on{background:var(--maroon);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;}
  .switch.on::after{left:20px;}
  .wish-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px;}
</style>
</head>
<body>
<div class="phone" id="phone">

/* ---------------- HELPERS ---------------- */
function stars(rating){
  let s='';
  for(let i=1;i<=5;i++){
    s+=`<span style="color:${i<=Math.round(rating)?'var(--gold)':'var(--line)'}">${ICON.star}</span>`;
  }
  return `<span style="display:inline-flex;gap:1px;vertical-align:middle;">${s.replace(/<svg/g,'<svg style="width:11px;height:11px;"')}</span>`;
}
function findProduct(id){return products.find(p=>p.id===id);}
function cartCount(){return state.cart.reduce((a,c)=>a+c.qty,0);}
function cartSubtotal(){return state.cart.reduce((a,c)=>a+findProduct(c.productId).price*c.qty,0);}
function toast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function go(screen,opts={}){
  state.history.push(state.screen);
  Object.assign(state,opts);
  state.screen=screen;
  render();
}
function back(){
  state.screen=state.history.pop()||'home';
  render();
}
function setTab(navKey){
  const map={home:'home',category:'categories',cart:'cart',wishlist:'wishlist',profile:'profile'};
  state.history=[];
  state.screen=map[navKey];
  render();
}
function addToCart(productId,qty,shadeIdx){
  const existing=state.cart.find(c=>c.productId===productId && c.shadeIdx===shadeIdx);
  if(existing){existing.qty+=qty;}
  else{state.cart.push({productId,qty,shadeIdx});}
  toast('Added to cart');
}
function updateCartQty(idx,delta){
  state.cart[idx].qty+=delta;
  if(state.cart[idx].qty<=0)state.cart.splice(idx,1);
  render();
}
function removeCartItem(idx){state.cart.splice(idx,1);render();}
function toggleWishlist(id,ev){
  if(ev)ev.stopPropagation();
  if(state.wishlist.has(id))state.wishlist.delete(id);
  else state.wishlist.add(id);
  render();
}
function placeOrder(){
  const order={
    id:'GO-'+(state.orderCounter++),
    date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    items:state.cart.map(c=>({...c})),
    total:cartSubtotal()+50,
    status:'Processing',
    address:state.addresses.find(a=>a.id===state.selectedAddress),
  };
  state.orders.unshift(order);
  state.cart=[];
  state.modal=null;
  toast('Order placed successfully');
  go('orderSuccess',{lastOrder:order});
}

/* ---------------- RENDER SCREENS ---------------- */
function render(){
  const el=document.getElementById('screen');
  el.innerHTML = SCREENS[state.screen] ? SCREENS[state.screen]() : SCREENS.home();
  el.scrollTop = 0;
  attachBottomNavIfNeeded();
  if(state.modal){renderModal();}
}

function bottomNav(activeKey){
  const items=[
    {key:'home',icon:ICON.home,label:'Home'},
    {key:'category',icon:ICON.category,label:'Category'},
    {key:'cart',icon:ICON.cart,label:'',center:true},
    {key:'wishlist',icon:ICON.heart,label:'Wishlist'},
    {key:'profile',icon:ICON.profile,label:'Profile'},
  ];
  return `<div class="bottomnav">
    ${items.map(it=>{
      if(it.center){
        return `<div class="navitem center" onclick="setTab('cart')">
          <div class="navcart-circle">${ICON.cart}</div>
          ${cartCount()>0?`<span class="cartbadge">${cartCount()}</span>`:''}
        </div>`;
      }
      return `<div class="navitem ${activeKey===it.key?'active':''}" onclick="setTab('${it.key}')">
        ${it.icon}<span>${it.label}</span>
      </div>`;
    }).join('')}
  </div>`;
}

SCREENS.trackOrder = function(){
  const o=state.orders.find(x=>x.id===state.trackOrderId);
  if(!o)return SCREENS.orders();
  const steps=[
    {key:'Processing',title:'Order Placed',desc:"We've received your order and are getting it ready."},
    {key:'Confirmed',title:'Order Confirmed',desc:'Your order has been confirmed and is being packed.'},
    {key:'Shipped',title:'Shipped',desc:'Your order is on its way to your address.'},
    {key:'Delivered',title:'Delivered',desc:'Your order has arrived. Enjoy your glow!'},
  ];
  const statusOrder=['Processing','Confirmed','Shipped','Delivered'];
  const currentIdx = statusOrder.indexOf(o.status)>=0?statusOrder.indexOf(o.status):0;
  return `
  ${backBar('Track Order')}
  <div class="content" style="padding-bottom:100px;">
    <div class="order-card" style="margin-bottom:20px;">
      <div class="top"><span class="oid">${o.id}</span><span class="status-pill status-${o.status}">${o.status}</span></div>
      <div class="date">Placed on ${o.date}</div>
      <div class="order-items" style="margin-top:8px;">${o.items.map(it=>findProduct(it.productId).name+' × '+it.qty).join(', ')}</div>
      <div class="order-bottom"><span class="order-total">EGP ${o.total}</span></div>
    </div>
    <div class="timeline">
      ${steps.map((s,i)=>`
        <div class="tl-step">
          <div class="tl-dot-wrap">
            <div class="tl-dot ${i<=currentIdx?'done':''}">${i<=currentIdx?'✓':(i+1)}</div>
            ${i<steps.length-1?`<div class="tl-line ${i<currentIdx?'done':''}"></div>`:''}
          </div>
          <div class="tl-text"><h4>${s.title}</h4><p>${s.desc}</p></div>
        </div>`).join('')}
    </div>
    ${currentIdx<steps.length-1?`<button class="outline-btn" onclick="advanceOrder('${o.id}')">Simulate Next Step</button>`:''}
  </div>
  ${bottomNav('profile')}`;
};
function advanceOrder(id){
  const o=state.orders.find(x=>x.id===id);
  const seq=['Processing','Confirmed','Shipped','Delivered'];
  const idx=seq.indexOf(o.status);
  if(idx<seq.length-1){o.status=seq[idx+1];}
  render();
}

  if(state.modal==='address'){
    const html=`
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <div class="modal-head">
          <h3 class="serif">Select Delivery Address</h3>
          <div class="icon-btn" onclick="closeModal()">${ICON.close}</div>
        </div>
        ${state.addresses.map(a=>`
          <div class="addr-opt ${state.selectedAddress===a.id?'selected':''}" onclick="state.selectedAddress=${a.id};renderModal()">
            <div class="radio"></div>
            <div style="flex:1"><div class="lbl">${a.icon} ${a.label}</div><div class="txt">${a.text}</div></div>
          </div>`).join('')}
        <div class="addnew" onclick="addNewAddress();renderModal()">${ICON.plus} Add New Address</div>
        <button class="primary-btn" style="margin-top:4px;" onclick="placeOrder()">Continue</button>
      </div>
    </div>`;
    let holder=document.getElementById('modalHolder');
    if(!holder){ holder=document.createElement('div'); holder.id='modalHolder'; el.appendChild(holder);}
    holder.innerHTML=html;
  }
}
function closeModal(){ state.modal=null; const h=document.getElementById('modalHolder'); if(h)h.remove(); }

/* toast element persistent */
function ensureToast(){
  const phone=document.getElementById('phone');
  if(!document.getElementById('toast')){
    const t=document.createElement('div');
    t.id='toast'; t.className='toast';
    phone.appendChild(t);
  }
}

/* ---------------- INIT ---------------- */
ensureToast();
render();
</script>
</body>
</html>
