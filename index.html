<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFTKASA GARAGE</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --bg2:#0c1326; --card:#0e1730; --line:#1c2b4d;
  --cyan:#20d7f0; --mag:#ff2fd6; --grad:linear-gradient(90deg,var(--cyan),var(--mag));
  --text:#eaf2ff; --muted:#7c8bb3; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter','Tajawal',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
body{padding-top:var(--safe-t);padding-bottom:var(--safe-b);}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:
  radial-gradient(circle at 15% 0%, rgba(32,215,240,.10), transparent 40%),
  radial-gradient(circle at 100% 10%, rgba(255,47,214,.10), transparent 45%), var(--bg);
  padding-bottom:78px;position:relative;overflow-x:hidden;}
header.top{position:sticky;top:0;z-index:20;background:rgba(7,11,22,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px;font-size:15px;}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
.badge{position:absolute;top:-6px;left:-6px;background:var(--grad);color:#fff;font-size:10px;font-weight:800;
  border-radius:10px;padding:1px 5px;}
main{padding:16px;}
h1,h2,h3{margin:0;}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.pill-btn{display:block;text-align:center;background:var(--grad);color:#06121f;font-weight:800;border:none;
  border-radius:30px;padding:13px;font-size:14.5px;cursor:pointer;width:100%;font-family:inherit;}
.outline-btn{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--cyan);border-radius:30px;
  padding:10px;color:var(--text);font-weight:700;font-size:13.5px;background:transparent;cursor:pointer;font-family:inherit;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
.hero{border-radius:18px;padding:22px 18px;position:relative;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(160deg,#0d1732,#0a0f22 60%);margin-bottom:16px;}
.hero .glow-line{height:3px;border-radius:4px;background:var(--grad);width:70px;margin-top:12px;}
.hero h2{font-size:19px;line-height:1.5;font-weight:800;}
.quick3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
.quick3 .qbtn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;
  font-size:12px;font-weight:700;color:var(--text);}
.qbtn .ic{width:34px;height:34px;margin:0 auto 6px;border-radius:10px;background:rgba(32,215,240,.12);
  display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:17px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
.section-title h3{font-size:15px;font-weight:800;}
.section-title span{color:var(--muted);font-size:12px;}
.row-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:10px;cursor:pointer;}
.row-card .thumb{width:56px;height:56px;border-radius:10px;background:linear-gradient(160deg,#122043,#0a1226);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.row-card .meta{flex:1;}
.row-card .meta b{font-size:13.5px;}
.row-card .arrow{color:var(--muted);}
.cat-icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.cat-icons .cbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;
  font-size:11px;cursor:pointer;color:var(--text);}
.cat-icons .cbtn.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset;}
.cat-icons .ic{font-size:18px;margin-bottom:4px;}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:12px;color:var(--muted);font-size:13px;}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.chip{flex-shrink:0;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12.5px;background:var(--card);
  color:var(--text);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--grad);color:#06121f;font-weight:800;border:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.product{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;position:relative;}
.product .img{height:90px;border-radius:10px;background:linear-gradient(160deg,#132247,#0a1226);display:flex;
  align-items:center;justify-content:center;font-size:30px;margin-bottom:8px;position:relative;}
.product .fav{position:absolute;top:14px;left:14px;color:var(--muted);font-size:14px;}
.product .tag{position:absolute;top:8px;right:8px;background:var(--grad);color:#06121f;font-size:9px;font-weight:800;
  padding:2px 7px;border-radius:8px;}
.product b{font-size:12.5px;display:block;margin-bottom:2px;}
.product .sub{color:var(--muted);font-size:10.5px;display:block;margin-bottom:6px;}
.product .price{font-weight:800;font-size:13px;margin-bottom:8px;display:block;}
.addcart{width:100%;background:var(--grad);color:#06121f;border:none;border-radius:20px;padding:7px;font-size:11.5px;
  font-weight:800;cursor:pointer;font-family:inherit;}
.detail-img{height:220px;border-radius:16px;background:linear-gradient(160deg,#132247,#0a1226);display:flex;
  align-items:center;justify-content:center;font-size:64px;margin-bottom:14px;border:1px solid var(--line);}
.badges{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.badge2{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;text-align:center;color:var(--muted);flex:1;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text);}
.field{margin-bottom:14px;}
select,textarea,input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px;font-family:inherit;font-size:13px;}
textarea{resize:none;min-height:70px;}
.upload{border:1.5px dashed var(--line);border-radius:14px;padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:14px;cursor:pointer;}
.upload .ic{font-size:24px;margin-bottom:6px;}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.typecard{border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-size:12.5px;font-weight:700;}
.typecard.active{border-color:var(--cyan);background:rgba(32,215,240,.08);}
.typecard .ic{font-size:18px;margin-bottom:6px;}
.machinerow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;}
.machinerow .m{border:1.5px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:10px;cursor:pointer;}
.machinerow .m.active{border-color:var(--mag);}
.machinerow .m .ic{font-size:16px;margin-bottom:4px;display:block;}
.cart-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--card);}
.qty{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;}
.qty button{background:none;border:none;color:var(--text);font-size:15px;cursor:pointer;}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-size:14px;font-weight:800;}
.success{text-align:center;padding:40px 10px;}
.check{width:70px;height:70px;border-radius:50%;border:3px solid transparent;background:var(--grad) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;position:relative;}
.check::before{content:'✓';font-size:30px;color:var(--cyan);background:var(--bg);width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;}
.foot-brand{margin-top:36px;text-align:center;color:var(--muted);font-size:12px;}
.foot-brand .fl{width:44px;height:44px;border-radius:12px;background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-size:20px;margin:0 auto 8px;}
.social{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:15px;color:var(--cyan);}
.contact-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:10px;background:var(--card);}
.contact-row .ic{width:38px;height:38px;border-radius:10px;background:rgba(32,215,240,.12);color:var(--cyan);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.account-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;}
nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:rgba(9,13,26,.95);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:10px 6px calc(10px + var(--safe-b));z-index:30;}
nav.bottom button{background:none;border:none;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;
  align-items:center;gap:4px;cursor:pointer;font-family:inherit;font-weight:600;}
nav.bottom button.active{color:var(--cyan);}
nav.bottom .ic{font-size:18px;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:700;font-size:14px;cursor:pointer;}
.hide{display:none !important;}

/* ===== Splash (animated first page) ===== */

  transition:opacity .8s ease,transform .8s ease,visibility .8s;}
#splash.gone{opacity:0;transform:scale(1.08);visibility:hidden;pointer-events:none;}

const x = a => a[LI()];         // pick from an [en, ar] pair
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const mlabel = m => m==='Other' ? t('other') : m;

function setLang(l){
  state.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  go('home');
}

function render(){
 if(cart.some(c=>!c))cart=cart.filter(Boolean); // safety net: drop any corrupted cart entries
 const app = document.getElementById('app');
 if(state.view==='lang'){ app.innerHTML = langPage(); return; }
 try{
  app.innerHTML = header() + main() + bottomNav();
 }catch(e){
  console.error('render() failed:',e,'view=',state.view,'cart=',cart);
  cart=[]; state.view='home';
  try{ app.innerHTML = header() + main() + bottomNav(); }catch(e2){ console.error('render() failed again:',e2); }
 }
}

function langPage(){
 return `<div class="langpage">
  <img class="lg-logo" src="${IMG.logo}" alt="IFTKASA GARAGE">
  <h2 class="lg-title">Choose your language</h2>
  <h2 class="lg-title ar">اختر اللغة</h2>
  <div class="lg-btns">
   <button class="lg-btn" onclick="setLang('ar')" aria-label="العربية"><span class="lg-flag">${FLAG.eg}</span><span class="lg-name">العربية</span><span class="lg-go">‹</span></button>
   <button class="lg-btn" onclick="setLang('en')" aria-label="English"><span class="lg-flag">${FLAG.gb}</span><span class="lg-name">English</span><span class="lg-go">›</span></button>
  </div>
 </div>`;
}

function back(to){ return `<div class="back-row" onclick="go('${to}')"><span>${t('arrowBack')}</span> ${t('back')}</div>`; }

function main(){
 switch(state.view){
  case 'home': return home();
  case 'cats': return cats();
  case 'list': return list();
  case 'detail': return detail();
  case 'cart': return cartView();
  case 'checkoutInfo': return checkoutInfoView();
  case 'checkoutSummary': return checkoutSummaryView();
 case 'checkoutConfirm': return checkoutConfirmView();
  case 'fiber': return fiberView();
  case 'fiberForm': return fiberForm();
  case 'mods': return modsList();
  case 'modDetail': return modDetail();
  case 'modForm': return modForm();
  case 'contact': return contact();
  case 'account': return account();
  case 'addresses': return addressesView();
  case 'success': return success();
  default: return home();
 }
}

let sq='',stm;w('renderList',o=>function(){const r=o.apply(this,arguments);clearTimeout(stm);stm=setTimeout(()=>{const v=String(state.q||'').trim().toLowerCase().slice(0,60);if(skip()||v.length<2||v===sq)return;sq=v;db.collection('searches').add({q:v,n:document.querySelectorAll('#pgrid .product').length,day:day(),ts:TS(),sid}).catch(()=>{})},1500);return r});
/* favorites (only additions are counted) */
w('toggleFav',o=>function(k){let was=false;try{was=JSON.parse(ls('ift_fav')||'[]').includes(k)}catch(e){}const r=o.apply(this,arguments);if(!was){const p=P.find(z=>String(z.id||z.n[0]).replace(/['"\\]/g,'')==k);ev('fav',p||{id:k,n:['',k]})}return r});
/* orders: attach traffic source + referral, and close the abandoned-cart record */
const c0=db.collection.bind(db);
db.collection=n=>{const r=c0(n);if(n=='orders'){const a=r.add.bind(r);r.add=d=>{const rf=ls('ift_ref');Object.assign(d,{src:SRC.s,med:SRC.m,camp:SRC.c,sid});if(rf&&iftRC(d.phone||'')!=rf)d.ref=rf;return a(d).then(x=>{c0('carts').doc(sid).set({ordered:true,orderedAt:TS()},{merge:true}).catch(()=>{});return x})}}return r};
/* share: product image + link (with the sender's referral code), tracked */
window.shareP=async()=>{const p=P[state.product];if(!p)return;ev('share',p);const rc=String(state.cPhone||'').replace(/\D/g,'').length>=8?'&ref='+iftRC(state.cPhone):'',
 u=location.origin+location.pathname+'?utm_source=share'+rc+'#p='+encodeURIComponent(p.id||p.n[0]),tx=x(p.n)+' — '+x(p.price)+'\n'+u;
 try{if(p.img&&navigator.canShare){const b=await(await fetch(p.img)).blob(),f=new File([b],'product.jpg',{type:b.type||'image/jpeg'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:tx});return}}}catch(e){}
 if(navigator.share){navigator.share({title:x(p.n),text:tx}).catch(()=>{});return}window.open('https://wa.me/?text='+encodeURIComponent(tx),'_blank')};
/* referral page ("Refer a friend") */
const referView=()=>{const pc=Number((SET.s||{}).refPct)||0,ph=state.rp||state.cPhone||'',ok=ph.replace(/\D/g,'').length>=8,code=ok?iftRC(ph):'',u=location.origin+location.pathname+'?ref='+code,
 tx=L('Shop at IFTKASA GARAGE and get '+pc+'% off your first order: ','اشتري من IFTKASA GARAGE واخد خصم '+pc+'% على أول طلب: ')+u;
 return `<main>${back('account')}<h2 style="font-size:16px;margin-bottom:12px">🎁 ${L('Refer a friend','اجيب صاحبك')}</h2><div class="card" style="line-height:1.9;font-size:13px;margin-bottom:12px">${L('Send your link to a friend. They get '+pc+'% off, and once their order is delivered you get a '+pc+'% coupon too.','ابعت رابطك لصاحبك. هياخد خصم '+pc+'%، ولما طلبه يوصله انت كمان بتاخد كوبون خصم '+pc+'%.')}</div>
 <input type="text" inputmode="tel" dir="ltr" placeholder="${esc(L('Your phone number','رقم موبايلك'))}" value="${esc(ph)}" oninput="state.rp=this.value"><button class="pill-btn" onclick="render()">${L('Get my link','هات رابطي')}</button>
 ${ok?`<div class="card" style="margin-top:14px;text-align:center"><div class="grad-text" style="font-size:24px;font-weight:900;letter-spacing:2px">${code}</div><a class="pill-btn" style="margin-top:12px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(tx)}">💬 ${L('Share on WhatsApp','ابعتها على واتساب')}</a></div>`:''}</main>`};
w('account',o=>function(){return o.apply(this,arguments).replace('</main>',()=>`<div class="row-card" onclick="go('refer')"><div class="thumb">🎁</div><div class="meta"><b>${L('Refer a friend','اجيب صاحبك')}</b></div><div class="arrow">${t('arrowFwd')}</div></div></main>`)});
w('main',o=>function(){return state.view=='refer'?referView():o.apply(this,arguments)});
/* welcome coupon + admin-controlled banner pop-up */
async function pop(s){const on=!(s.bnEnd&&new Date(s.bnEnd)<Date.now()),ttl=on?(LI()?(s.bnTitleAr||s.bnTitleEn):(s.bnTitleEn||s.bnTitleAr)):'',tx=on?(LI()?(s.bnAr||s.bnEn):(s.bnEn||s.bnAr)):'',im=on?s.bnImg:'';let cp=null;
 if(isNew&&s.welcome){try{const r=await db.collection('coupons').where('code','==',s.welcome).get(),d=r.docs[0]&&{id:r.docs[0].id,...r.docs[0].data()};if(d&&d.active!==false&&!(d.max&&(d.uses||0)>=d.max))cp=d}catch(e){}}
 if(!ttl&&!tx&&!im&&!cp)return;
 const b=document.createElement('div');b.className='rmod';b.onclick=e=>{if(e.target==b)b.remove()};
 b.innerHTML=`<div class="rmc" style="text-align:center">${ttl?`<h3 class="grad-text" style="font-size:18px">${esc(ttl)}</h3>`:''}${im?`<img src="${esc(im)}" alt="" style="width:100%;border-radius:14px;margin-bottom:12px">`:''}${tx?`<p style="font-size:13.5px;line-height:1.8">${esc(tx)}</p>`:''}${cp?`<div class="card" style="margin:12px 0"><div style="font-size:12px;color:var(--muted)">${L('Welcome gift — first order','هدية الترحيب — أول طلب')}</div><div class="grad-text" style="font-size:26px;font-weight:900;letter-spacing:2px">${esc(cp.code)}</div><div style="font-size:12px">${cp.type=='percent'?cp.value+'%':cp.value+' '+L('EGP','ج.م')} ${L('off','خصم')}</div></div>`:''}<button class="pill-btn">${cp?L('Use my code','استخدم الكود'):L('Shop now','تسوق الآن')}</button></div>`;
 b.querySelector('button').onclick=()=>{if(cp){state.cCode=cp.code;state.cpn={code:cp.code,type:cp.type,value:Number(cp.value),id:cp.id}}b.remove();go('list')};
 document.body.appendChild(b)}
const pt=setInterval(()=>{const s=SET.s;if(!s||!Object.keys(s).length||state.view=='lang'||document.getElementById('splash'))return;clearInterval(pt);if(skip()||ss('ift_pop'))return;sset('ift_pop','1');pop(s)},800);
})();
</script>

<script id="ift-acct">
(function(){
/* ---------- helpers ---------- */
const fsx=()=>firebase.firestore();
const TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ldel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const jl=(k)=>{try{return JSON.parse(ls(k)||'[]')}catch(e){return[]}};
const GATED=['checkoutInfo','checkoutSummary','checkoutConfirm'];
const NEEDS=['myorders','notifs','profile','addresses','refer','return','retDone'];
const AD='٠١٢٣٤٥٦٧٨٩',PD='۰۱۲۳۴۵۶۷۸۹';
const en=s=>String(s==null?'':s).replace(/[٠-٩۰-۹]/g,c=>{let i=AD.indexOf(c);if(i<0)i=PD.indexOf(c);return i});
const normPhone=p=>{let d=en(p).replace(/\D/g,'');
 if(d.indexOf('0020')==0)d='0'+d.slice(4);else if(d.indexOf('20')==0&&d.length==12)d='0'+d.slice(2);else if(d.length==10&&d[0]=='1')d='0'+d;
 return /^01[0125]\d{8}$/.test(d)?d:''};
const getUser=()=>{try{const u=JSON.parse(ls('ift_user')||'null');return u&&u.phone&&u.name?u:null}catch(e){return null}};
const setUser=u=>lset('ift_user',JSON.stringify(u));
const ACC={orders:null,loading:false,fail:false};

/* saved addresses / favorites are kept per account on this device */
const stash=(ph,save)=>{['ift_addrs','ift_fav'].forEach(k=>{
 if(save){const v=ls(k);if(v)lset(k+'_'+ph,v);ldel(k)}else{const v=ls(k+'_'+ph);if(v)lset(k,v)}})};
const applyUser=u=>{state.cName=u.name;state.cPhone=u.phone;state.tp=u.phone;state.rp=u.phone};
const tst=msg=>{let el=document.getElementById('iftToast');
 if(!el){el=document.createElement('div');el.id='iftToast';el.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:12.5px;z-index:9999;opacity:0;transition:opacity .2s;max-width:80%;text-align:center';document.body.appendChild(el)}
 el.textContent=msg;el.style.opacity='1';clearTimeout(window._iftToastT);window._iftToastT=setTimeout(()=>{el.style.opacity='0'},2000)};

const ico={o:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',n:'<path d="M5 4h14v12H8l-3 3z"/>',u:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 p:'<path d="M5 4h3.5l1.6 4.2-2 1.6a12.7 12.7 0 0 0 6.1 6.1l1.6-2 4.2 1.6V19a2 2 0 0 1-2 2C10.6 21 3 13.4 3 6a2 2 0 0 1 2-2z"/>'};
const fld=(ic,lb,inner)=>`<div class="af"><span class="afi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ico[ic]}</svg></span><div class="afb"><label>${lb}</label>${inner}</div></div>`;
const rw=(lb,ic,js,sub)=>`<div class="row-card" onclick="${js}"><div class="thumb">${ic}</div><div class="meta"><b>${lb}</b>${sub?`<div class="acc-sub">${sub}</div>`:''}</div><div class="arrow">${t('arrowFwd')}</div></div>`;

/* ---------- account record in Firestore (best effort) ---------- */
async function saveRemote(u){
 const ref=fsx().collection('accounts').doc(u.phone);let ex=false;
 try{ex=(await ref.get()).exists}catch(e){}
 try{await ref.set(ex?{lastLogin:TS()}:{name:u.name,phone:u.phone,lang:state.lang||'',createdAt:TS(),lastLogin:TS()},{merge:true})}
 catch(e){console.warn('accounts write skipped (add a Firestore rule for "accounts" to keep them on the server):',e&&e.code)}}

/* ---------- orders / requests of the logged-in customer ---------- */
async function fetchOrders(){
 const u=getUser();if(!u){ACC.orders=[];return[]}
 const d=fsx(),q=[d.collection('orders').where('phone','==',u.phone).get(),d.collection('orders').where('acct','==',u.phone).get(),d.collection('requests').where('phone','==',u.phone).get()];
 const r=await Promise.allSettled(q),m={};
 r.forEach((z,i)=>{if(z.status!='fulfilled')return;z.value.docs.forEach(doc=>{const k=i==2?'r':'o';m[k+doc.id]=Object.assign({},doc.data(),{id:doc.id,k})})});
 ACC.fail=r.every(z=>z.status!='fulfilled');
 ACC.orders=Object.keys(m).map(k=>m[k]).sort((a,b)=>((b.createdAt||{}).seconds||0)-((a.createdAt||{}).seconds||0));
 return ACC.orders}
const ensure=view=>{if(ACC.orders==null&&!ACC.loading){ACC.loading=true;fetchOrders().catch(()=>{ACC.orders=[];ACC.fail=true}).then(()=>{ACC.loading=false;if(state.view==view)render()})}};
window.iftReload=()=>{ACC.orders=null;ACC.fail=false;render()};

const ST={new:['Received','تم الاستلام'],contacted:['Confirmed','تم التأكيد'],progress:['In progress','جاري التنفيذ'],out:['Out for delivery','خرج للتوصيل'],done:['Delivered','تم التسليم'],cancelled:['Cancelled','ملغي']};
const stLbl=o=>o.k=='r'&&o.status=='done'?L('Completed','مكتمل'):x(ST[o.status]||ST.new);
const stIdx={new:1,contacted:2,progress:2,out:3,done:4};
const dt=o=>{const s=(o.createdAt&&o.createdAt.seconds)||0;return s?new Date(s*1000).toLocaleDateString(LI()?'ar-EG':'en-GB',{day:'numeric',month:'short',year:'numeric'}):''};
const money=n=>n==null||n===''?L('After inspection','بعد المعاينة'):Number(n).toLocaleString('en-US')+' '+L('EGP','ج.م');

/* ---------- views ---------- */
function authView(){
 const from=state.afterAuth,gt=from&&GATED.indexOf(from)>=0;
 return `<main>${back(gt?'cart':'account')}
 <img class="auth-logo" src="${IMG.logo}" alt="">
 <h2 style="font-size:19px;text-align:center;margin-bottom:6px" class="grad-text">${L('Create your account','أنشئ حسابك')}</h2>
 <p style="text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8;margin:0 0 16px">${L('Just your name and phone number — takes a few seconds','اسمك ورقم موبايلك بس — بياخد ثواني')}</p>
 ${gt?`<div class="auth-note">🛒 ${L('You need an account before placing an order. Your cart is saved.','لازم يكون عندك حساب قبل ما تأكد الطلب. السلة بتاعتك محفوظة.')}</div>`:''}
 ${fld('u',L('Full name *','الاسم بالكامل *'),`<input type="text" id="aN" autocomplete="name" value="${esc(state.aN||'')}" oninput="state.aN=this.value" onkeydown="if(event.key=='Enter')iftAuth()">`)}
 ${fld('p',L('Phone number *','رقم الموبايل *'),`<input type="text" id="aP" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="01xxxxxxxxx" value="${esc(state.aP||'')}" oninput="state.aP=this.value" onkeydown="if(event.key=='Enter')iftAuth()">`)}
 <div class="auth-err" id="authErr"></div>
 <button class="pill-btn" id="authBtn" onclick="iftAuth()">${L('Create account / Sign in','إنشاء حساب / تسجيل الدخول')}</button>
 <p class="hint" style="margin-top:14px;text-align:center">${L('New here? We create your account automatically. Already have one? Enter the same number to sign in.','أول مرة؟ هننشئ حسابك تلقائي. عندك حساب؟ اكتب نفس الرقم وهتدخل.')}</p></main>`}

window.iftAuth=()=>{
 const n=String((document.getElementById('aN')||{}).value||'').trim().replace(/\s+/g,' '),p=normPhone((document.getElementById('aP')||{}).value),e=document.getElementById('authErr');
 if(n.length<2||!/[A-Za-z\u0600-\u06FF]/.test(n)){e.textContent=L('Please enter your full name','من فضلك اكتب اسمك بالكامل');return}
 if(!p){e.textContent=L('Enter a valid Egyptian mobile number (01xxxxxxxxx)','اكتب رقم موبايل مصري صحيح (01xxxxxxxxx)');return}
 const b=document.getElementById('authBtn');if(b)b.disabled=true;
 const u={name:n,phone:p,at:Date.now()};
 stash(p,false);setUser(u);applyUser(u);ACC.orders=null;ACC.fail=false;saveRemote(u);
 tst(L('Welcome, ','أهلاً بيك يا ')+n.split(' ')[0]+' 👋');
 const to=state.afterAuth;state.afterAuth=null;state.aN='';state.aP='';go(to||'account')};

function ordersView(){
 const u=getUser();ensure('myorders');
 let body;
 if(ACC.orders==null)body=`<p class="muted-c">…</p>`;
 else if(ACC.fail)body=`<p class="muted-c">${L('Could not load your orders right now.','مقدرناش نحمّل طلباتك دلوقتي.')}</p><button class="outline-btn" style="margin:0 auto" onclick="iftReload()">${L('Try again','حاول تاني')}</button>`;
 else if(!ACC.orders.length)body=`<p class="muted-c">📦<br>${L('No orders yet','لسه مفيش طلبات')}</p><button class="pill-btn" onclick="go('list')">${L('Start shopping','ابدأ التسوق')}</button>`;
 else{
  const pts=Math.floor(ACC.orders.filter(o=>o.k=='o'&&o.status=='done').reduce((s,o)=>s+(Number(o.total)||0),0)/100);
  body=(pts?`<div class="card" style="margin-bottom:12px">⭐ ${L('Loyalty points','نقاط الولاء')}: <b>${pts}</b></div>`:'')+ACC.orders.map(o=>{
   const isO=o.k=='o',cx=o.status=='cancelled',n=stIdx[o.status]||1;
   return `<div class="card ord"><div class="ord-h"><b>${isO?'#'+esc(o.id.slice(-6).toUpperCase()):esc(x([o.titleEn||'',o.titleAr||o.titleEn||'']))}</b><span class="st-pill st-${esc(o.status||'new')}">${esc(stLbl(o))}</span></div>
   <div class="ord-d">${esc(dt(o))}${isO&&o.pay?' · '+(o.pay=='instapay'?t('paymentInstapay'):t('paymentCash')):''}${isO&&o.gov?' · '+esc(o.gov):''}</div>
   ${isO?`<div class="ord-i">${(o.items||[]).map(i=>esc(x([i.name||'',i.nameAr||i.name||'']))+' ×'+esc(i.qty)).join('<br>')}</div>`:(o.machine||o.model?`<div class="ord-i">${esc((o.machine||'')+' '+(o.model||''))}</div>`:'')}
   ${isO&&!cx?`<div class="ord-steps">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div><div class="ord-lbls"><span>${L('Received','استلام')}</span><span>${L('Confirmed','تأكيد')}</span><span>${L('On the way','في الطريق')}</span><span>${L('Delivered','تسليم')}</span></div>`:''}
   ${isO?`<div class="ord-t"><span>${L('Total','الإجمالي')}</span><b>${money(o.total)}</b></div>`:(o.quote!=null&&o.quote!==''?`<div class="ord-t"><span>${L('Quote','التسعيرة')}</span><b>${money(o.quote)}</b></div>`:'')}
   ${o.custMsg?`<div style="font-size:12px;margin-top:8px">💬 ${esc(o.custMsg)}</div>`:''}</div>`}).join('')}
 return `<main>${back('account')}<h2 style="font-size:16px;margin-bottom:12px">📋 ${t('myOrders')}</h2>${body}</main>`}

function notifsView(){
 ensure('notifs');const s=SET.s||{},items=[];
 const an=(SET.an||[])[LI()]||(SET.an||[])[1-LI()];if(an)items.push(['📢',L('Announcement','إعلان'),an]);

function returnView(){
 const u=getUser();ensure('return');
 const chips=(ACC.orders||[]).filter(o=>o.k=='o').slice(0,5).map(o=>{const n=o.id.slice(-6).toUpperCase();return `<span class="chip" onclick="state.rO='${n}';render()">#${n}</span>`}).join(' ');
 return `<main>${back('account')}<h2 style="font-size:16px;margin-bottom:6px">↩️ ${L('Return request','طلب استرجاع')}</h2>
 <p class="hint">${L('Write your order number and the reason. We will contact you on your phone number.','اكتب رقم الطلب والسبب، وهنتواصل معاك على رقم موبايلك.')}</p>
 ${fld('o',L('Order number *','رقم الطلب *'),`<input type="text" id="rO" dir="ltr" placeholder="#ABC123" autocomplete="off" value="${esc(state.rO||'')}" oninput="state.rO=this.value">`)}
 ${chips?`<div style="margin:-4px 0 12px">${chips}</div>`:''}
 ${fld('n',L('Reason for return *','سبب الاسترجاع *'),`<textarea rows="3" id="rR" placeholder="${L('Tell us what went wrong...','قولنا إيه المشكلة...')}" oninput="state.rR=this.value">${esc(state.rR||'')}</textarea>`)}
 ${fld('p',L('Your phone','رقم موبايلك'),`<input type="text" dir="ltr" value="${esc(u.phone)}" readonly style="opacity:.6">`)}
 <div class="auth-err" id="authErr"></div>
 <button class="pill-btn" id="retBtn" onclick="iftSendReturn()">${L('Send return request','ابعت طلب الاسترجاع')}</button>
 <div class="chip" style="display:block;text-align:center;margin-top:12px" onclick="state.page='policy';go('page')">${L('Read the returns & warranty policy','اقرأ سياسة الاسترجاع والضمان')}</div></main>`}
window.iftSendReturn=async()=>{const u=getUser();if(!u)return;
 let no=String(state.rO||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();if(no.length>6)no=no.slice(-6);
 const rs=String(state.rR||'').trim(),er=m=>{document.getElementById('authErr').textContent=m};
 if(no.length<4){er(L('Enter your order number','اكتب رقم الطلب'));return}
 if(rs.length<5){er(L('Write the reason for the return','اكتب سبب الاسترجاع'));return}
 if(ACC.orders&&!ACC.fail&&!ACC.orders.some(o=>o.k=='o'&&o.id.slice(-6).toUpperCase()==no)){er(L('This order number is not on your account','رقم الطلب ده مش على حسابك'));return}
 const b=document.getElementById('retBtn');if(b){if(b.dataset.busy)return;b.dataset.busy='1';b.disabled=true}
 try{await fsx().collection('returns').add({orderId:'#'+no,name:u.name,phone:u.phone,reason:rs,amount:'',date:new Date().toISOString().slice(0,10),status:'Requested',src:'customer',createdAt:TS()})}
 catch(e){console.warn('returns write failed (allow create on "returns" in Firestore rules):',e);if(b){b.disabled=false;delete b.dataset.busy}er(t('cErr'));return}
 state.lastWa='↩️ طلب استرجاع\nرقم الطلب: #'+no+'\nالسبب: '+rs+'\nالموبايل: '+u.phone+'\nالاسم: '+u.name;
 state.rO='';state.rR='';go('retDone')};
function retDoneView(){const n=String(SET.wa||'').replace(/\D/g,''),wa=n?'https://wa.me/'+(n[0]=='0'?'2'+n:n)+'?text='+encodeURIComponent(state.lastWa||''):'';
 return `<main><div class="success"><div class="check"></div><h2 style="font-size:18px;margin-bottom:10px">${L('Return request sent','اتبعت طلب الاسترجاع')}</h2>
 <p style="color:var(--muted);font-size:13px;line-height:1.8">${L('We received your order number, reason and phone. We will contact you soon.','استلمنا رقم الطلب والسبب ورقم موبايلك. هنتواصل معاك قريب.')}</p>
 ${wa?`<div style="margin-top:18px"><a class="pill-btn" style="text-decoration:none" target="_blank" rel="noopener" href="${wa}">💬 ${L('Send on WhatsApp too','ابعت على واتساب كمان')}</a></div>`:''}

/* ---------- referral: random single-use codes ---------- */
let CP=[];
try{fsx().collection('coupons').onSnapshot(sn=>{CP=sn.docs.map(d=>Object.assign({id:d.id},d.data()));if(state.view=='refer')render()},()=>{})}catch(e){}
const refPct=()=>{const v=(SET.s||{}).refPct;return v===undefined||v===null||v===''?10:(Number(v)||0)};
const findC=code=>CP.find(k=>String(k.code).toUpperCase()==String(code||'').trim().toUpperCase());
const usable=c=>!!c&&c.active!==false&&!(c.max&&(c.uses||0)>=c.max);
const isOwn=c=>{if(!c||!c.owner)return false;const u=getUser();return !!((u&&c.owner==u.phone)||c.owner==normPhone(state.cPhone))};
const CHR='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>{let c;do{c='IFT'+Array.from({length:5},()=>CHR[Math.floor(Math.random()*CHR.length)]).join('')}while(findC(c));return c};
window.iftNewRef=async()=>{const u=getUser();if(!u)return;const pc=refPct();if(!pc)return;
 if(CP.some(c=>c.kind=='referral'&&c.owner==u.phone&&usable(c)))return;
 const b=document.getElementById('rfBtn');if(b){if(b.dataset.busy)return;b.dataset.busy='1';b.disabled=true}
 try{await fsx().collection('coupons').add({code:genCode(),type:'percent',value:pc,min:'',max:1,uses:0,active:true,kind:'referral',owner:u.phone,ownerName:u.name,createdAt:TS()})}
 catch(e){console.warn('coupon create failed (allow create on "coupons" in Firestore rules):',e);if(b){b.disabled=false;delete b.dataset.busy}alert(t('cErr'))}};
window.iftCopy=c=>{try{navigator.clipboard.writeText(c).then(()=>tst(L('Copied ✅','اتنسخ ✅')),()=>prompt('',c))}catch(e){prompt('',c)}};
function referView2(){
 const u=getUser(),pc=refPct(),mine=CP.filter(c=>c.kind=='referral'&&c.owner==u.phone),act=mine.find(usable),used=!act&&mine.length>0;
 let body;
 if(!pc)body=`<p class="muted-c">🤝<br>${L('The referral offer is not active right now','عرض الترشيح مش شغال دلوقتي')}</p>`;
 else if(act){const lnk=location.origin+location.pathname+'?ref='+act.code,tx=L('Use my code '+act.code+' at IFTKASA GARAGE and get '+act.value+'% off your order: ','استخدم كودي '+act.code+' في IFTKASA GARAGE واخد خصم '+act.value+'% على طلبك: ')+lnk;
  body=`<div class="card" style="text-align:center"><div style="font-size:12px;color:var(--muted)">${L('Your code','الكود بتاعك')}</div><div class="grad-text" dir="ltr" style="font-size:30px;font-weight:900;letter-spacing:3px;margin:8px 0">${esc(act.code)}</div><div class="acc-sub">${act.value}% ${L('off for your friend','خصم لصاحبك')}</div>
  <button class="outline-btn" style="width:100%;margin-top:14px" onclick="iftCopy('${esc(act.code)}')">${L('Copy code','انسخ الكود')}</button>
  <a class="pill-btn" style="margin-top:10px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(tx)}">💬 ${L('Share on WhatsApp','ابعته على واتساب')}</a></div>`}
 else body=(used?`<div class="card" style="margin-bottom:12px;text-align:center;font-size:13px">✅ ${L('Your last code was used. Get a new one to keep sharing.','كودك الأخير اتستخدم. هات كود جديد وكمّل ترشيح.')}</div>`:'')+`<button class="pill-btn" id="rfBtn" onclick="iftNewRef()">${used?L('Get a new code','هات كود جديد'):L('Get my code','هات الكود بتاعي')}</button>`;
 return `<main>${back('account')}<h2 style="font-size:16px;margin-bottom:12px">🤝 ${L('Refer a friend','اجيب صاحبك')}</h2>
 <div class="card" style="line-height:1.9;font-size:13px;margin-bottom:12px">${L('Send your code to a friend and they get '+pc+'% off. The code works once, for one person only, and you cannot use it yourself. When their order is delivered you get a '+pc+'% reward code.','ابعت الكود لصاحبك وهياخد خصم '+pc+'%. الكود بيتستخدم مرة واحدة ولشخص واحد بس، ومينفعش انت تستخدمه. ولما طلب صاحبك يوصله بتاخد كود خصم '+pc+'% مكافأة.')}</div>${body}</main>`}
/* the friend's link puts the code in the cart automatically */
{const r=ls('ift_ref');if(r){lset('ift_refcode',r.toUpperCase());ldel('ift_ref')}}
const autoRef=()=>{if(state.cpn)return;const rc=ls('ift_refcode');if(!rc)return;const c=findC(rc);if(usable(c)&&!isOwn(c)){state.cCode=c.code;state.cpn={code:c.code,type:c.type,value:Number(c.value),id:c.id}}};
const _gs=window.goToSummary;window.goToSummary=function(){autoRef();return _gs.apply(this,arguments)};
const _ac=window.applyCoupon;window.applyCoupon=function(){const c=findC(state.cCode);if(c&&isOwn(c)){state.cpn=null;alert(L('You cannot use your own referral code','مينفعش تستخدم كود الترشيح بتاعك'));render();return}return _ac.apply(this,arguments)};

window.account=accountView;
const VIEWS={auth:authView,myorders:ordersView,notifs:notifsView,profile:profileView,addresses:addrView,return:returnView,retDone:retDoneView,refer:referView2};
const _main=window.main;
window.main=function(){
 if((GATED.indexOf(state.view)>=0||NEEDS.indexOf(state.view)>=0)&&!getUser()){state.afterAuth=state.view;state.view='auth'}
 const v=VIEWS[state.view];return v?v():_main.apply(this,arguments)};
/* no account -> no checkout */
const _go=window.go;
window.go=function(v){if(GATED.indexOf(v)>=0&&!getUser()){state.afterAuth=v;v='auth'}return _go(v)};
const _po=window.placeOrder;
window.placeOrder=function(){const u=getUser();
 if(!u){state.afterAuth='checkoutConfirm';go('auth');return}
 if(state.cpn){const c=findC(state.cpn.code);if(c&&isOwn(c)){state.cpn=null;alert(L('You cannot use your own referral code','مينفعش تستخدم كود الترشيح بتاعك'));go('checkoutSummary');return}}
 if(!String(state.cName||'').trim())state.cName=u.name;if(!String(state.cPhone||'').trim())state.cPhone=u.phone;
 const r=_po.apply(this,arguments);Promise.resolve(r).then(()=>{ACC.orders=null});return r};
/* stamp every order with the account it came from */
const F=fsx(),_c=F.collection.bind(F);
F.collection=n=>{const r=_c(n);
 if(n=='orders'){const a=r.add.bind(r);r.add=async d=>{const u=getUser();if(!u)return a(d);
  const cc=d.coupon&&findC(d.coupon),ex={acct:u.phone,acctName:u.name};if(cc&&cc.kind=='referral'&&cc.owner)ex.ref=window.iftRC(cc.owner);
  try{return await a(Object.assign({},d,ex))}catch(e){if(e&&e.code=='permission-denied')return a(Object.assign({},d,cc&&cc.owner?{ref:ex.ref}:{}));throw e}}}
 return r};
/* restore the session after a page reload */
const u0=getUser();if(u0){applyUser(u0)}
})();

<script id="ift-pay">
(function(){
const ok8=()=>{const p=state.paySS&&state.paySS[0];return p};
/* number to transfer to + amount (admin sets the number in Store content & settings) */
window.iftPayInfo=()=>{const s=SET.s||{},num=String(s.instaNum||'').trim(),nm=String(s.instaName||'').trim(),info=String(s.payInfo||'').trim();
 let tot=null;try{tot=calcOrder().total}catch(e){}
 if(!num&&!info)return '';
 return `<div class="pay-card"><div class="pay-h">${L('Transfer via InstaPay to this number','حوّل بإنستاباي على الرقم ده')}</div>
 ${num?`<div class="pay-num"><b>${esc(num)}</b><button type="button" class="pay-copy" onclick="iftPayCopy(this)" data-n="${esc(num)}">${L('Copy','نسخ')}</button></div>`:''}
 ${nm?`<div class="pay-row"><span>${L('Account name','اسم الحساب')}</span><b>${esc(nm)}</b></div>`:''}
 ${tot!=null?`<div class="pay-row"><span>${L('Amount to transfer','المبلغ المطلوب تحويله')}</span><b>${egpFmt(tot)}</b></div>`:''}
 ${info?`<div class="pay-extra">${esc(info)}</div>`:''}</div>`};
window.iftPayCopy=b=>{const n=b.getAttribute('data-n');const done=()=>{b.textContent=L('Copied ✅','اتنسخ ✅')};
 try{navigator.clipboard.writeText(n).then(done,()=>prompt('',n))}catch(e){prompt('',n)}};

/* screenshot box */
window.iftPaySS=()=>{const p=ok8();
 const inp=`<input id="paySSInput" type="file" accept="image/*" class="hide" onchange="addPaySS(this)">`;
 const lab=`<label class="upload" for="paySSInput"><div class="ic">🧾</div>${t('uploadPhoto')}<br><span style="font-size:11px">${t('screenshotHint')}</span></label>`;
 let body;
 if(!p)body=lab+`<div style="font-size:11.5px;color:#ff5c72;margin-top:-6px">${t('screenshotRequired')}</div>`;
 else if(p.err)body=`<div class="pay-up bad"><div class="pu-t" style="color:#ff5c72">${esc(p.err)}</div><button type="button" class="pay-x" onclick="removePaySS()">×</button></div>`+lab;
 else body=`<div class="pay-up ${p.busy?'':'ok'}"><img src="${esc(p.url||'')}" alt=""><div class="pu-t">${p.busy?`<span class="spin"></span>${L('Uploading the screenshot…','بنرفع الصورة…')}`:`✅ ${L('Screenshot uploaded','الصورة اترفعت')}`}<div style="color:var(--muted);font-size:11px;word-break:break-all">${esc(p.name||'')}</div></div><button type="button" class="pay-x" onclick="removePaySS()">×</button></div>`;
 return `<div class="field" style="margin-top:12px"><label>${t('uploadScreenshot')} <span style="color:#ff5c72">*</span></label>${body}${inp}</div>`};

const shrink=async(f,mx,q)=>{try{let w,h,src;
 if(window.createImageBitmap){try{src=await createImageBitmap(f);w=src.width;h=src.height}catch(e){src=null}}
 if(!src){src=await new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image;i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej()};i.src=u});w=src.naturalWidth||src.width;h=src.naturalHeight||src.height}
 const sc=Math.min(1,mx/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
 const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);try{src.close&&src.close()}catch(e){}
 return await new Promise(res=>c.toBlob(bl=>res(bl),'image/jpeg',q))}catch(e){return null}};
const blobToData=bl=>new Promise(res=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(bl)});
const rawRead=f=>new Promise(res=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)});
const rr=()=>{if(['checkoutSummary','checkoutConfirm'].includes(state.view))render()};

window.addPaySS=async function(inp){
 const f=(inp.files||[])[0];if(!f)return;try{inp.value=''}catch(e){}
 if(f.type&&!/^image\//.test(f.type)){state.paySS=[{err:L('Please choose an image file','اختار صورة من فضلك')}];render();return}
 let prev='';try{prev=URL.createObjectURL(f)}catch(e){}
 const p={url:prev,name:f.name,busy:1};state.paySS=[p];render();
 const fail=m=>{if(state.paySS[0]!==p)return;state.paySS=[{err:m}];rr()};
 let bl=await shrink(f,900,.6);
 if(!bl&&f.size<=700*1024)bl=f;
 if(!bl){fail(L('Could not read this image. Try a screenshot (JPG/PNG).','مقدرناش نقرا الصورة دي. جرب لقطة شاشة (JPG/PNG).'));return}
 const inline=async()=>{const d=await blobToData(bl);if(!d||d.length>800000)throw new Error('big');return d};
 let url;
 try{
  if(!firebase.storage)throw new Error('no storage');
  const ref=firebase.storage().ref('uploads/orders/'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)+'.jpg');
  /* upload to Storage but never make the customer wait more than 5s: fall back to the small inline copy */
  url=await Promise.race([ref.put(bl,{contentType:'image/jpeg'}).then(()=>ref.getDownloadURL()),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))]);
 }catch(e){console.warn('Storage upload slow/failed - using the compact inline copy:',e);
  try{url=await inline()}catch(e2){fail(L('The image is too large. Try a smaller screenshot.','الصورة كبيرة. جرب لقطة شاشة أصغر.'));return}}
 if(state.paySS[0]!==p)return;
 p.data=url;p.busy=0;rr()};
window.removePaySS=()=>{state.paySS=[];render()};

/* don't continue while the image is still uploading */
const guard=()=>{if((state.pay||'cash')!='instapay')return true;const p=ok8();
 if(p&&p.busy){alert(L('The screenshot is still uploading, wait a second','الصورة لسه بتترفع، استنى ثانية'));return false}
 if(p&&p.err){alert(p.err);return false}
 if(!p||!p.data){alert(t('screenshotRequired'));return false}return true};
const _gc=window.goToConfirm;window.goToConfirm=function(){if(!guard())return;return _gc.apply(this,arguments)};
const _po=window.placeOrder;window.placeOrder=function(){if(!guard())return;return _po.apply(this,arguments)};
})();
</script>

<script id="ift-quote">
(function(){
Object.assign(D,{
 orderNow:['Order now','اطلب الآن'],
 pqTitle:['Ask for the price','اسأل عن السعر'],
 pqDetails:['Details','التفاصيل'],
 pqSend:['Send price request','ابعت طلب التسعير']
});
const key=p=>p.id||p.n[0];
const cur=()=>P.find(p=>key(p)===state.pq);

/* ---- Order now: direct purchase. The item goes straight to checkout and never enters the cart ---- */
const CKV=['checkoutInfo','checkoutSummary','checkoutConfirm','auth'];
const endBuyNow=()=>{if(!state.buyNow)return;cart=state.savedCart||[];state.savedCart=null;state.buyNow=false};
window.orderNow=function(i){
 const p=P[i];if(!p)return;
 if(p.num==null){askPrice(i);return}
 if(p.stock!=null&&p.stock<=0){alert(t('cOut'));return}
 if(!state.buyNow){state.savedCart=cart;state.cpn=null;state.cCode=''}
 state.buyNow=true;cart=[p];state.product=i;
 go('checkoutInfo');
};

/* ---- Ask for price: never touches the cart, opens a pre-filled request ---- */
const pqDefault=p=>{
 const ar=LI();
 return [(ar?'عايز أعرف سعر: ':'I would like to know the price of: ')+x(p.n),
  x(p.s)||'',
  p.fits?((ar?'يناسب: ':'Fits: ')+p.fits):''].filter(Boolean).join('\n');
};
window.askPrice=function(i){
 const p=P[i];if(!p)return;
 state.product=i;state.pq=key(p);
 state.pqFrom=(state.view==='detail'||state.view==='list'||state.view==='home')?state.view:'detail';
 state.pqDetails=pqDefault(p);
 go('priceQuote');
};
const pqView=()=>{
 const p=cur();
 if(!p)return `<main>${back('list')}</main>`;
 return `<main>${back(state.pqFrom||'list')}
 <h2 style="font-size:16px;margin-bottom:12px">${t('pqTitle')}</h2>
 <div class="pq-prod"><div class="pq-img">${pic(p)}</div><div style="min-width:0"><span style="color:var(--muted);font-size:11px;display:block">${t('product')}</span><b style="font-size:14px">${esc(x(p.n))}</b><span class="pq-price">${esc(x(p.price))}</span></div></div>
 <div class="field"><label>${t('pqDetails')}</label><textarea style="min-height:110px" oninput="state.pqDetails=this.value">${esc(state.pqDetails||'')}</textarea></div>
 <div class="field"><label>${t('make')}</label>${machineRow('modMachine')}</div>
 <div class="field"><label>${t('model')}</label><input type="text" placeholder="PCX - NMAX - Click" value="${esc(state.modModel||'')}" oninput="state.modModel=this.value"></div>
 ${cust()}
 <button class="pill-btn" onclick="submitPQ()">${t('pqSend')}</button>
 </main>`;
};
window.submitPQ=async function(){
 const p=cur();if(!p||state._pqBusy)return;
 if(!okC())return;
 state._pqBusy=1;
 try{
  await firebase.firestore().collection('requests').add({type:'mod',kind:'price',productId:p.id||'',titleEn:p.n[0],titleAr:p.n[1],details:state.pqDetails||'',machine:state.modMachine||'',model:state.modModel||'',photos:[],name:state.cName.trim(),phone:state.cPhone.trim(),status:'new',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  state.lastWa='💰 استفسار عن سعر: '+p.n[1]+'\n'+(state.pqDetails||'')+'\n'+(state.modMachine||'')+' '+(state.modModel||'')+'\n'+state.cName+' - '+state.cPhone;
  state.pq=null;state.pqDetails='';
  state.view='success';render();window.scrollTo(0,0);
 }catch(e){console.error('price request failed:',e);alert(t('cErr'))}
 finally{state._pqBusy=0}
};

/* register the new view */
const _main=main;
main=function(){
 if(state.view==='priceQuote')return pqView();
 const h=_main.apply(this,arguments);
 if(state.buyNow&&state.view==='checkoutInfo')return h.replace("onclick=\"go('cart')\"",()=>"onclick=\"go('detail')\"");
 return h;
};
/* leave checkout (or finish the order) -> the real cart comes back untouched */
const _rn=render;
render=function(){if(state.buyNow&&(CKV.indexOf(state.view)<0)){if(state.view!=='success'){state.cpn=null;state.cCode=''}endBuyNow()}return _rn.apply(this,arguments)};
const _hd=header;
header=function(){let h=_hd.apply(this,arguments);if(state.buyNow)h=h.replace(/<span class="badge">[^<]*<\/span>/,'');return h};

/* safety net: any other "add to cart" entry point on a price-on-request item opens the price form instead */
const _atc=addToCart;
addToCart=function(i){const p=P[i];if(p&&p.num==null){askPrice(i);return}return _atc.apply(this,arguments)};
})();
</script>
<script id="ift-history">
(function(){
 const K=()=>state.view+'|'+state.product+'|'+state.mod+'|'+state.fiberProblem;
 const snap=()=>({v:state.view,p:state.product,m:state.mod,f:state.fiberProblem});
 let last=null,pop=false,boot=true,prev=state.view;
 try{history.replaceState(snap(),'');last=K()}catch(e){}
 const _r=render;
 render=function(){const r=_r.apply(this,arguments);try{sync()}catch(e){}return r};
 function sync(){
  if(pop)return;const k=K();if(k===last)return;
  if(boot&&prev==='lang'){history.replaceState(snap(),'');boot=false}
  else history.pushState(snap(),'');
  last=k;prev=state.view}
 addEventListener('popstate',e=>{const s=e.state;if(!s||!s.v)return;pop=true;
  try{state.view=s.v;state.product=s.p;state.mod=s.m;state.fiberProblem=s.f;
   const CK=['checkoutInfo','checkoutSummary','checkoutConfirm'];
   if(CK.includes(state.view)&&!cart.length&&!state.buyNow)state.view='home';
   if(state.view==='success')state.view='home';
   if(state.view==='fiberForm'&&state.fiberProblem==null)state.view='fiber';
   if((state.view==='modForm'||state.view==='modDetail')&&state.mod==null)state.view='mods';
   if(state.view==='detail'&&state.product==null)state.view='list';
   render();last=K();prev=state.view;try{toTop()}catch(_){}
  }finally{pop=false}});
})();
</script>
